name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        # bash on every OS (Git Bash on Windows) so the test file glob expands the same way.
        shell: bash
    steps:
      # Keep LF endings on Windows so content tests see the same bytes as on Linux/macOS.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "cc-harness CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      # Node 20 does not expand globs passed to --test (added in Node 21), so the shell
      # expands the list; all test files live directly under test/.
      - name: Unit and integration tests
        run: node --test test/*.test.mjs
      - name: Lint the repository's own contracts
        run: node bin/harness.mjs lint-contract
